name: Android APK

# Builds the Trenkės Android app (Capacitor wrapper around the web app in the repo root)
# and publishes Trenkes.apk under the fixed release tag "android", so the download link
# https://github.com/Igratt/trenkes/releases/latest/download/Trenkes.apk always has the newest build.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - 'native/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        working-directory: native
        run: npm ci

      - name: Copy the web app into the Android project
        working-directory: native
        run: npm run sync

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/trenkes.p12"

      - name: Build the signed release APK
        working-directory: native/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/trenkes.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect the APK
        run: cp native/android/app/build/outputs/apk/release/app-release.apk Trenkes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Trenkes-apk
          path: Trenkes.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Trenkės Android
          body: Trenkės Android programa. Atsisiųsk Trenkes.apk telefone ir atidaryk failą.
          files: Trenkes.apk
